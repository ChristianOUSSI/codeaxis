name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: |
          for file in assets/js/*.js; do
            node --check "$file" || exit 1
          done

      - name: Check HTML validity
        run: |
          # Basic HTML validation - check for unclosed tags
          for file in *.html; do
            echo "Checking $file..."
            # Simple check for basic structure
            grep -q '<!DOCTYPE html>' "$file" || (echo "Missing DOCTYPE in $file" && exit 1)
            grep -q '</html>' "$file" || (echo "Missing closing html tag in $file" && exit 1)
          done

      - name: Check for broken links
        run: |
          # Check that all internal links point to existing files
          for file in *.html; do
            grep -o 'href="[^"]*\.html"' "$file" | sed 's/href="//;s/"//' | while read link; do
              if [[ "$link" != http* && "$link" != "#"* && ! -f "$link" ]]; then
                echo "Broken link in $file: $link"
                exit 1
              fi
            done
          done

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/main'
        run: |
          npm i -g vercel
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
