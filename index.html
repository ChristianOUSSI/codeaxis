<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description"
    content="CODE AXIS Digital Cameroon. Agence Digitale d'Élite à Douala : Innovation, Développement Web & Mobile, Design UI/UX, Cloud & IA.">
  <title>CODE AXIS Digital Cameroon | Chargement</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#eef1f5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" href="assets/img/logo-mark.png">
  <link rel="canonical" href="https://codeaxis.cm/">

  <link rel="preload" as="image" href="assets/img/logo-cadc.png">
  <link rel="prefetch" as="document" href="home.html">
  <link rel="prefetch" as="style" href="assets/css/cadc-fusion.css">
  <link rel="prefetch" as="script" href="assets/js/cadc-app.js">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --ink: #2e4257;
      --ink-deep: #1d2c3d;
      --steel: #5c7794;
      --teal: #0d8f7a;
      --paper: #eef1f5;
      --paper-hi: #f6f8fa;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: 'Oxanium', sans-serif;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      background: radial-gradient(125% 78% at 50% 34%, var(--paper-hi) 0%, var(--paper) 52%, #dfe6ee 100%) #dfe6ee;
      /* grain papier en pointillés, comme le loader evo-gaz */
      animation: splash-guard 4.2s ease forwards;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(rgba(46, 66, 87, 0.07) 0.7px, transparent 0.7px),
        radial-gradient(rgba(92, 119, 148, 0.06) 0.7px, transparent 0.7px);
      background-size: 9px 9px, 13px 13px;
      background-position: 0 0, 4px 6px;
      pointer-events: none;
    }

    @keyframes splash-guard {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .splash {
      position: relative;
      text-align: center;
      padding: 20px;
      z-index: 2;
    }

    .splash-plate {
      position: relative;
      display: inline-block;
    }

    .splash-halo {
      position: absolute;
      inset: -14%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(92, 119, 148, 0.34) 0%, rgba(46, 66, 87, 0.14) 46%, transparent 72%);
      animation: splash-breathe 4.2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes splash-breathe {

      0%,
      100% {
        opacity: 0.5;
        transform: scale(0.95);
      }

      50% {
        opacity: 1;
        transform: scale(1.06);
      }
    }

    .splash-mark {
      position: relative;
      display: block;
      width: min(330px, 72vw);
      max-height: 56vh;
      height: auto;
      margin: 0 auto;
      animation: mark-in 1.05s cubic-bezier(0.16, 0.84, 0.28, 1) both, mark-hold 5.2s 1.1s ease-in-out infinite;
    }

    @keyframes mark-in {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.93);
        filter: blur(4px);
      }

      to {
        opacity: 1;
        transform: none;
        filter: none;
      }
    }

    @keyframes mark-hold {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.017);
      }
    }

    /* Ligne de scan qui balaie l'emblème */
    .splash-scan {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 6%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(13, 143, 122, 0.85), transparent);
      box-shadow: 0 0 16px rgba(13, 143, 122, 0.55);
      opacity: 0;
      animation: splash-scan 3.1s 0.9s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes splash-scan {
      0% {
        opacity: 0;
        transform: translateY(0);
      }

      12% {
        opacity: 1;
      }

      55% {
        opacity: 1;
        transform: translateY(240px);
      }

      70% {
        opacity: 0;
        transform: translateY(240px);
      }

      100% {
        opacity: 0;
        transform: translateY(0);
      }
    }

    /* Barre glissante indéterminée */
    .splash-bar {
      display: block;
      position: relative;
      width: 148px;
      height: 2px;
      margin: 30px auto 0;
      background: rgba(46, 66, 87, 0.18);
      overflow: hidden;
    }

    .splash-bar::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: -42%;
      width: 42%;
      background: linear-gradient(90deg, transparent, var(--ink), transparent);
      animation: splash-slide 1.5s ease-in-out infinite;
    }

    @keyframes splash-slide {
      to {
        left: 100%;
      }
    }

    .splash-status {
      margin: 16px 0 0;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--steel);
      min-height: 1.4em;
      transition: opacity 0.35s ease;
    }

    .splash-skip {
      position: fixed;
      bottom: clamp(16px, 4vh, 32px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      background: none;
      border: 1px solid rgba(46, 66, 87, 0.28);
      color: var(--ink);
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 9px 22px;
      border-radius: 40px;
      cursor: pointer;
      opacity: 0;
      animation: appear 0.7s 2s ease forwards;
      transition: background 0.25s ease, color 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .splash-skip:hover {
      background: var(--ink);
      color: var(--paper-hi);
    }

    @keyframes appear {
      to {
        opacity: 1;
      }
    }

    .curtain {
      position: fixed;
      inset: 0;
      background: var(--paper);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    .leaving .curtain {
      opacity: 1;
      pointer-events: all;
    }

    @media (prefers-reduced-motion: reduce) {

      body,
      .splash-mark,
      .splash-halo,
      .splash-scan,
      .splash-skip,
      .splash-bar::after {
        animation: none !important;
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="curtain"></div>

  <main class="splash">
    <div class="splash-plate">
      <span class="splash-halo" aria-hidden="true"></span>
      <img class="splash-mark" src="assets/img/logo-cadc.png" alt="CODE AXIS Digital Cameroon">
      <span class="splash-scan" aria-hidden="true"></span>
    </div>

    <span class="splash-bar" role="progressbar" aria-label="Chargement du site" aria-valuemin="0"
      aria-valuemax="100"></span>

    <p class="splash-status" id="status">Initialisation</p>
  </main>

  <button class="splash-skip" id="skip-btn" type="button">Entrer sur le site</button>

  <script>
    (function () {
      var status = document.getElementById('status');
      var skip = document.getElementById('skip-btn');
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var steps = [
        ['Initialisation', 0],
        ['Chargement des actifs', 1100],
        ['Calibrage des surfaces', 2300],
        ['Prêt', 3500]
      ];
      var done = false;
      var timers = [];

      steps.forEach(function (s) {
        timers.push(setTimeout(function () {
          status.style.opacity = '0';
          setTimeout(function () { status.textContent = s[0]; status.style.opacity = '1'; }, 180);
        }, s[1]));
      });

      function go() {
        if (done) return;
        done = true;
        timers.forEach(clearTimeout);
        document.body.classList.add('leaving');
        setTimeout(function () { window.location.href = 'home.html'; }, 600);
      }

      /* Le splash tient ~4,2 s, ou disparaît dès que home.html est préchargé si plus lent */
      timers.push(setTimeout(go, reduced ? 900 : 4200));
      skip.addEventListener('click', go);
      window.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') go();
      });
    })();
  </script>
  <script src="assets/js/icons.js"></script>
</body>

</html>
